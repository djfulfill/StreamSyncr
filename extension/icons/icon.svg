<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>   <!-- Sky blue -->
      <stop offset="50%" style="stop-color:#6366f1"/>  <!-- Indigo -->
      <stop offset="100%" style="stop-color:#8b5cf6"/>  <!-- Violet -->
    </linearGradient>

    <!-- Play button gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>

    <!-- Sync arrow gradient -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>  <!-- Cyan -->
      <stop offset="100%" style="stop-color:#a855f7"/> <!-- Purple -->
    </linearGradient>

    <!-- Glow filter for play button -->
    <filter id="playGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Sync ring (outer) -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#syncGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Sync ring (inner, opposite direction) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#syncGrad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="360 64 64" to="0 64 64" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Play button background circle -->
  <circle cx="64" cy="64" r="30" fill="url(#playGrad)" filter="url(#playGlow)"/>

  <!-- Play triangle -->
  <polygon points="53,44 53,84 84,64" fill="#0ea5e9" opacity="0.95">
    <!-- Subtle highlight on play button -->
    <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
  </polygon>

  <!-- Small sync indicator dots on the sync rings -->
  <g fill="url(#syncGrad)">
    <circle cx="64" cy="18" r="3" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="64" cy="110" r="3" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="180 64 64" to="540 64 64" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>