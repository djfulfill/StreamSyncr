<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>

    <!-- Play button gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>

    <!-- Sync arrow gradient -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Sync ring (outer) - static positioned with gaps to suggest motion -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#syncGrad)" stroke-width="3"
          stroke-dasharray="12 8 4 16 8 12" opacity="0.7"/>

  <!-- Sync ring (inner) - complementary dash pattern -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#syncGrad)" stroke-width="2"
          stroke-dasharray="8 16 12 4" opacity="0.4"/>

  <!-- Play button background circle -->
  <circle cx="64" cy="64" r="30" fill="url(#playGrad)"/>

  <!-- Play triangle -->
  <polygon points="53,44 53,84 84,64" fill="#0ea5e9"/>

  <!-- Sync indicator dots - positioned to suggest rotation -->
  <g fill="url(#syncGrad)">
    <circle cx="64" cy="18" r="3" opacity="0.7"/>
    <circle cx="110" cy="64" r="2.5" opacity="0.5"/>
    <circle cx="64" cy="110" r="3" opacity="0.6"/>
    <circle cx="18" cy="64" r="2.5" opacity="0.5"/>
  </g>
</svg>