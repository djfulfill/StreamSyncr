<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamSyncr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e8e8ed;
    }

    .header {
      padding: 20px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #12121a;
      border-bottom: 1px solid #1e1e2e;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.connected { background: #22c55e; }
    .status-dot.warning { background: #f59e0b; }

    .auto-sync-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #9ca3af;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      background: #374151;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-switch.active { background: #6366f1; }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch.active::after { transform: translateX(16px); }

    .section-header {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      padding: 12px 12px 4px;
    }

    .services {
      padding: 0 12px 12px;
    }

    .service-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      background: #12121a;
      border-radius: 12px;
      border: 1px solid #1e1e2e;
      transition: border-color 0.2s;
    }

    .service-card:hover { border-color: #6366f1; }

    .service-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      flex-shrink: 0;
    }

    .service-info { flex: 1; min-width: 0; }

    .service-name {
      font-size: 14px;
      font-weight: 600;
    }

    .service-status {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .service-status.valid { color: #22c55e; }
    .service-status.expired { color: #ef4444; }

    .service-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .service-btn.sync {
      background: #6366f1;
      color: white;
    }

    .service-btn.sync:hover { background: #4f46e5; }

    .service-btn.login {
      background: #1e1e2e;
      color: #9ca3af;
    }

    .service-btn.login:hover { background: #2d2d3e; }

    .service-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cloud-relay {
      margin: 0 12px 12px;
      padding: 16px;
      background: #12121a;
      border-radius: 12px;
      border: 1px solid #1e1e2e;
    }

    .relay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .relay-title {
      font-size: 14px;
      font-weight: 600;
    }

    .relay-status {
      font-size: 11px;
      color: #6b7280;
    }

    .relay-status.active { color: #22c55e; }

    .relay-config {
      display: none;
      margin-top: 12px;
    }

    .relay-input {
      width: 100%;
      padding: 8px 12px;
      background: #0a0a0f;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      color: #e8e8ed;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .relay-input::placeholder { color: #4b5563; }

    .relay-input:focus {
      outline: none;
      border-color: #6366f1;
    }

    .save-relay-btn {
      width: 100%;
      padding: 8px;
      background: #1e1e2e;
      color: #9ca3af;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .save-relay-btn:hover { background: #2d2d3e; color: #e8e8ed; }

    .actions {
      padding: 12px 20px;
      border-top: 1px solid #1e1e2e;
    }

    .sync-all-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .sync-all-btn:hover { opacity: 0.9; }
    .sync-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer {
      padding: 12px 20px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      border-top: 1px solid #1e1e2e;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #9ca3af;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #1e1e2e;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>StreamSyncr</h1>
    <p>Auto-sync your streaming services</p>
  </div>

  <div class="status-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText" style="font-size: 12px;">Checking...</span>
    </div>
    <div class="auto-sync-toggle">
      <span>Auto-sync</span>
      <div class="toggle-switch active" id="autoSyncToggle"></div>
    </div>
  </div>

  <div class="services" id="servicesList">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <div class="cloud-relay">
    <div class="relay-header">
      <div class="relay-title">Cloud Relay</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="relay-status" id="cloudRelayStatus">Cloud relay disabled</span>
        <div class="toggle-switch" id="cloudRelayToggle"></div>
      </div>
    </div>
    <div class="relay-config" id="cloudRelayConfig">
      <input type="text" class="relay-input" id="relayEndpoint" placeholder="Cloud endpoint (e.g., https://relay.streamsyncr.app)">
      <input type="password" class="relay-input" id="relayToken" placeholder="Auth token (optional)">
      <button class="save-relay-btn" id="saveRelayBtn">Save</button>
    </div>
  </div>

  <div class="actions">
    <button class="sync-all-btn" id="syncAllBtn">Sync All Services</button>
  </div>

  <div class="footer">
    <div style="margin-bottom: 8px;">Cookies never leave your device</div>
    <button id="clearStorageBtn" style="padding: 6px 12px; background: #1e1e2e; color: #6b7280; border: 1px solid #374151; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s;">Clear Extension Storage</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
